```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
EXELARIS | Validador
</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
font-family:'Montserrat',sans-serif;
}

body{
background:
linear-gradient(
135deg,
#020617,
#111827,
#312e81
);
min-height:100vh;
}

.glass{
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
}

.neon{
text-shadow:
0 0 5px #ff00ff,
0 0 10px #ff00ff,
0 0 20px #ff00ff;
}

#reader{
border-radius:20px;
overflow:hidden;
}

</style>

</head>

<body>

<div class="container mx-auto px-4 py-8">

<div class="max-w-4xl mx-auto">

<div class="text-center mb-8">

<div
class="
w-28
h-28
mx-auto
rounded-full
bg-gradient-to-r
from-fuchsia-500
to-cyan-400
flex
items-center
justify-center">

<span
class="
text-white
text-5xl
font-black">

X

</span>

</div>

<h1
class="
text-white
text-5xl
font-black
mt-5
neon">

EXELARIS

</h1>

<p
class="
text-cyan-300
tracking-[8px]
mt-2">

CONTROL DE ACCESO

</p>

</div>

<div
class="
glass
rounded-3xl
p-6">

<div
class="
grid
md:grid-cols-2
gap-4">

<select
id="perfil"
class="
p-4
rounded-xl
text-black">

<option>Administrador</option>
<option>Validador 1</option>
<option>Validador 2</option>
<option>Validador 3</option>

</select>

<select
id="camara"
class="
p-4
rounded-xl
text-black">
</select>

</div>

<div
class="
mt-6
bg-white
rounded-3xl
overflow-hidden">

<div id="reader"></div>

</div>

<div
id="resultado"
class="
hidden
mt-6">
</div>

</div>

</div>

</div>

<script>

const API =
'https://fiestaretro-api.onrender.com';

let boletoActual = null;

let html5QrCode = null;

async function iniciarScanner(){

const selector =
document.getElementById(
'camara'
);

const cameras =
await Html5Qrcode.getCameras();

selector.innerHTML='';

cameras.forEach(cam=>{

const option =
document.createElement('option');

option.value = cam.id;

option.text =
cam.label || cam.id;

selector.appendChild(option);

});

let camaraTrasera =
cameras.find(cam=>
cam.label.toLowerCase().includes('back')
);

if(!camaraTrasera){

camaraTrasera =
cameras[cameras.length-1];

}

selector.value =
camaraTrasera.id;

iniciarCamara(
camaraTrasera.id
);

selector.onchange = ()=>{

location.reload();

};

}

async function iniciarCamara(cameraId){

html5QrCode =
new Html5Qrcode("reader");

await html5QrCode.start(

cameraId,

{
fps:10,
qrbox:300
},

async(decodedText)=>{

await html5QrCode.stop();

buscarBoleto(
decodedText
);

}

);

}

async function buscarBoleto(uuid){

const respuesta =
await fetch(

`${API}/api/validar/buscar`,

{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
uuid
})
}

);

const data =
await respuesta.json();

const resultado =
document.getElementById(
'resultado'
);

resultado.classList.remove(
'hidden'
);

if(!data.success){

resultado.innerHTML=`

<div
class="
bg-red-500
rounded-3xl
p-8
text-center">

<h2
class="
text-4xl
font-black">

❌ QR INVÁLIDO

</h2>

<p
class="mt-3">

${data.error}

</p>

</div>

`;

setTimeout(()=>{

location.reload();

},3000);

return;

}

boletoActual =
data.boleto;

resultado.innerHTML=`

<div
class="
${
boletoActual.estado==='activo'
?
'bg-green-500'
:
'bg-red-500'
}
rounded-3xl
p-8">

<h2
class="
text-4xl
font-black">

${
boletoActual.estado==='activo'
?
'✅ BOLETO VÁLIDO'
:
'❌ BOLETO UTILIZADO'
}

</h2>

<div
class="
mt-6
space-y-3
text-lg">

<p>
<strong>Folio:</strong>
${boletoActual.folio}
</p>

<p>
<strong>Nombre:</strong>
${boletoActual.nombre}
</p>

<p>
<strong>Tipo:</strong>
${boletoActual.tipo}
</p>

<p>
<strong>Correo:</strong>
${boletoActual.correo}
</p>

<p>
<strong>Estado:</strong>
${boletoActual.estado}
</p>

</div>

${
boletoActual.estado==='activo'
?
`
<button

onclick="confirmarAcceso()"

class="
mt-8
w-full
bg-black
text-white
p-5
rounded-2xl
font-black
text-xl">

CONFIRMAR ACCESO

</button>
`
:
''
}

</div>

`;

}

async function confirmarAcceso(){

const respuesta =
await fetch(

`${API}/api/validar/confirmar`,

{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

uuid:
boletoActual.uuid,

validador:
document.getElementById(
'perfil'
).value

})
}

);

const data =
await respuesta.json();

if(data.success){

document
.getElementById(
'resultado'
).innerHTML = `

<div
class="
bg-green-500
rounded-3xl
p-8
text-center">

<h2
class="
text-5xl
font-black">

🎉 ACCESO AUTORIZADO

</h2>

<p
class="
mt-4
text-xl">

Validado por:

<strong>

${document.getElementById(
'perfil'
).value}

</strong>

</p>

</div>

`;

setTimeout(()=>{

location.reload();

},2500);

}

}

iniciarScanner();

</script>

</body>
</html>
```
