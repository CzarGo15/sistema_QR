<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner VIP - Alto Rendimiento</title>
    <!-- Librería de QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #020617; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Estilos limpios para el lector de cámara */
        #reader { width: 100%; border-radius: 1rem; overflow: hidden; position: relative; }
        #reader video { object-fit: cover; }
        /* Animación del láser */
        .scan-laser {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background-color: #3b82f6; box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            animation: scan 2s infinite linear; z-index: 10; display: none;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-between relative">

    <!-- Encabezado -->
    <header class="w-full max-w-md p-4 flex justify-between items-center glass-panel z-20 absolute top-0">
        <div>
            <h1 class="font-bold text-lg text-white leading-tight">Acceso VIP</h1>
            <p class="text-xs text-slate-400 font-medium">Operador: Staff 01</p>
        </div>
        <div class="h-10 w-10 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700 shadow-inner text-blue-400">
            <i class="ph-fill ph-scan text-xl"></i>
        </div>
    </header>

    <!-- Contenedor Principal del Escáner -->
    <main class="flex-1 w-full flex flex-col items-center justify-center pt-20 pb-24 px-4 z-10">
        
        <div id="start-button-container" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-30">
            <button id="btn-start" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-2xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all flex items-center gap-3">
                <i class="ph-fill ph-camera text-2xl"></i> Activar Cámara Rápida
            </button>
            <p class="text-slate-500 mt-4 text-sm text-center max-w-xs">Toca para encender el motor de escaneo de alto rendimiento.</p>
        </div>

        <!-- Visor de la cámara -->
        <div class="relative w-full max-w-sm rounded-2xl border-2 border-slate-700 shadow-2xl overflow-hidden bg-black">
            <div id="reader" class="h-[60vh] max-h-[500px]"></div>
            <div id="laser" class="scan-laser"></div>
            
            <!-- Marco visual de objetivo -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
                <div class="w-48 h-48 border-2 border-white/20 rounded-xl relative">
                    <div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-blue-500 rounded-tl-xl"></div>
                    <div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-blue-500 rounded-tr-xl"></div>
                    <div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-blue-500 rounded-bl-xl"></div>
                    <div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-blue-500 rounded-br-xl"></div>
                </div>
            </div>
        </div>
        
    </main>

    <!-- Overlay de Resultados -->
    <div id="resultado-overlay" class="absolute inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 opacity-0 pointer-events-none transition-opacity duration-200">
        <div id="card-resultado" class="bg-white rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl transform translate-y-10 transition-transform duration-300">
            <div id="icono-resultado" class="text-6xl mb-4">✅</div>
            <h2 id="titulo-resultado" class="text-2xl font-black mb-2 text-slate-800">ACCESO PERMITIDO</h2>
            <p id="detalle-resultado" class="text-slate-500 mb-6 font-medium">Boleto validado con éxito.</p>
            <button onclick="cerrarModal()" id="btn-continuar" class="w-full bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-colors">
                Siguiente
            </button>
        </div>
    </div>

    <!-- Sintetizador de Audio -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isSuccess) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (isSuccess) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tono agudo
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Zumbido grave
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }
    </script>

    <!-- Lógica del Lector Optimizada -->
    <script>
        const boletosEscaneados = new Set();
        let html5QrCode;
        let escaneoPausado = false;

        const overlay = document.getElementById('resultado-overlay');
        const card = document.getElementById('card-resultado');
        const titulo = document.getElementById('titulo-resultado');
        const icono = document.getElementById('icono-resultado');
        const detalle = document.getElementById('detalle-resultado');
        const btnContinuar = document.getElementById('btn-continuar');
        const laser = document.getElementById('laser');

        function mostrarResultado(estado, texto) {
            escaneoPausado = true;
            html5QrCode.pause(); // Pausar cámara temporalmente ahorra batería y evita dobles lecturas
            laser.style.display = 'none';

            if (estado === 'EXITO') {
                playBeep(true);
                icono.innerText = '✅';
                titulo.innerText = 'ACCESO PERMITIDO';
                titulo.className = 'text-2xl font-black mb-2 text-emerald-600';
                detalle.innerText = texto;
                btnContinuar.className = 'w-full bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-4';
                
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                card.classList.remove('translate-y-10');
                
                // Cierre automático muy rápido si es éxito (agiliza la fila)
                setTimeout(cerrarModal, 1500);

            } else {
                playBeep(false);
                icono.innerText = '🛑';
                titulo.innerText = 'DUPLICADO';
                titulo.className = 'text-2xl font-black mb-2 text-rose-600';
                detalle.innerText = texto;
                btnContinuar.className = 'w-full bg-rose-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-4';
                btnContinuar.innerText = 'Bloquear y Continuar';
                
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                card.classList.remove('translate-y-10');
                // No se cierra automático, obliga al staff a interactuar
            }
        }

        function cerrarModal() {
            overlay.classList.add('opacity-0', 'pointer-events-none');
            card.classList.add('translate-y-10');
            setTimeout(() => { 
                escaneoPausado = false;
                laser.style.display = 'block';
                if(html5QrCode.getState() === 3) { // 3 = PAUSED
                    html5QrCode.resume();
                }
            }, 300);
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (escaneoPausado) return;
            
            // Simulación
            if (boletosEscaneados.has(decodedText)) {
                mostrarResultado('ERROR', `El código ID: ${decodedText.substring(0,8)}... ya ingresó.`);
            } else {
                boletosEscaneados.add(decodedText);
                mostrarResultado('EXITO', `ID Validado: ${decodedText.substring(0,8)}...`);
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('start-button-container').style.display = 'none';
            laser.style.display = 'block';
            
            // Inicializar usando la clase Core (Más rápida que el Scanner wrapper)
            html5QrCode = new Html5Qrcode("reader");

            // CONFIGURACIÓN DE ALTO RENDIMIENTO PARA MÓVILES
            const config = {
                fps: 30, // 30 cuadros por segundo para atraparlo en movimiento
                qrbox: { width: 250, height: 250 }, 
                aspectRatio: 1.0,
                disableFlip: false // Permite leerlo aunque el celular esté volteado
            };

            // Forzar el uso de la cámara trasera en alta definición
            html5QrCode.start(
                { facingMode: "environment" }, // Cámara trasera obligatoria
                config,
                onScanSuccess
            ).catch(err => {
                alert("Error al acceder a la cámara. Revisa los permisos.");
            });
        });
    </script>
</body>
</html>
